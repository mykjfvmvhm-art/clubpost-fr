name: Vérifications du projet

on:
  push:
    branches:
      - main
      - "chore/**"
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Tests, lint et build
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer pnpm
        run: npm install --global pnpm@10.6.5

      - name: Installer les dépendances
        run: pnpm install --no-frozen-lockfile

      - name: Exécuter les tests
        run: pnpm test

      - name: Vérifier le code (règles ESLint)
        run: pnpm exec eslint . --rule '{"prettier/prettier":"off"}'

      - name: Construire l'application
        run: pnpm build
